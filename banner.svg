<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Rudy Wijaya, Data Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#16345F"/>
      <stop offset="1" stop-color="#2B5C9E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BC0EB"/>
      <stop offset="1" stop-color="#9BE564"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>
    <!-- decorative chart -->
    <g transform="translate(640,50)" opacity="0.9">
      <rect x="0"   y="120" width="34" height="70"  rx="4" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="52"  y="90"  width="34" height="100" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="104" y="105" width="34" height="85"  rx="4" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="156" y="60"  width="34" height="130" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="208" y="30"  width="34" height="160" rx="4" fill="#ffffff" fill-opacity="0.28"/>
      <polyline points="17,100 69,70 121,85 173,40 225,12" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="400">
        <animate attributeName="stroke-dashoffset" from="400" to="0" dur="2.2s" fill="freeze"/>
      </polyline>
      <g fill="#9BE564">
        <circle cx="17" cy="100" r="5"/><circle cx="69" cy="70" r="5"/><circle cx="121" cy="85" r="5"/><circle cx="173" cy="40" r="5"/><circle cx="225" cy="12" r="6"/>
      </g>
    </g>
    <!-- text -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
      <text x="60" y="118" font-size="58" font-weight="700" letter-spacing="1">Rudy Wijaya</text>
      <rect x="62" y="136" width="120" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="60" y="184" font-size="28" font-weight="500" fill="#DCE8F7">Data Analyst</text>
      <text x="60" y="224" font-size="18" fill="#9FB8D9" letter-spacing="1.5">SQL  |  PYTHON  |  POWER BI  |  ETL</text>
    </g>
  </g>
</svg>
