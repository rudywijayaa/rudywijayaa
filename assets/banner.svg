<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Rudy Wijaya, Data Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050C1C"/><stop offset="0.5" stop-color="#0E2750"/><stop offset="1" stop-color="#1D4E89"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BC0EB"/><stop offset="1" stop-color="#9BE564"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BC0EB" stop-opacity="0.35"/><stop offset="1" stop-color="#5BC0EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="round"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#dots)"/>
    <circle cx="820" cy="80" r="260" fill="url(#glow)"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#fff">
      <text x="60" y="128" font-size="62" font-weight="700" letter-spacing="1">Rudy Wijaya</text>
      <rect x="62" y="148" width="130" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="60" y="198" font-size="30" font-weight="500" fill="#DCE8F7">Data Analyst</text>

      <text x="60" y="246" font-size="19" fill="#9FB8D9" letter-spacing="0.5" opacity="1">
        Turning raw data into clear insights
        <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.28;0.36;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="246" font-size="19" fill="#9FB8D9" letter-spacing="1.5" opacity="0">
        SQL  |  PYTHON  |  POWER BI
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.38;0.61;0.69;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="246" font-size="19" fill="#9FB8D9" letter-spacing="1.5" opacity="0">
        ETL  |  DASHBOARDS  |  MACHINE LEARNING
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.71;0.94;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- terminal card -->
    <g transform="translate(590,62)">
      <rect width="350" height="196" rx="14" fill="#07142B" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="24" cy="24" r="6" fill="#FF5F56"/><circle cx="46" cy="24" r="6" fill="#FFBD2E"/><circle cx="68" cy="24" r="6" fill="#27C93F"/>
      <line x1="0" y1="46" x2="350" y2="46" stroke="#ffffff" stroke-opacity="0.1"/>
      <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="17">
        <text x="26" y="82"><tspan fill="#5BC0EB">SELECT</tspan><tspan fill="#E6EDF7"> insight</tspan></text>
        <text x="26" y="112"><tspan fill="#5BC0EB">FROM</tspan><tspan fill="#E6EDF7"> raw_data</tspan></text>
        <text x="26" y="142"><tspan fill="#5BC0EB">WHERE</tspan><tspan fill="#E6EDF7"> value </tspan><tspan fill="#9BE564">&gt; 0</tspan><tspan fill="#E6EDF7">;</tspan></text>
        <rect x="26" y="158" width="10" height="20" fill="#9BE564">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
